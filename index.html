<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfMessenger V5 - Final Fix</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #2563eb; --wolf: #ef4444; --gold: #facc15; }
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        .app-container { display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #0b1120; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .main-chat { flex-grow: 1; display: flex; flex-direction: column; background: #0f172a; }
        .messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
        .msg.sent { background: var(--primary); align-self: flex-end; }
        .msg.received { background: #1e293b; align-self: flex-start; }
        .msg.system { border-left: 4px solid var(--gold); background: rgba(250,204,21,0.1); width: 100%; color: var(--gold); }
        .player-card { padding: 10px; border-bottom: 1px solid #1e293b; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .player-card.dead { opacity: 0.3; text-decoration: line-through; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; background: var(--primary); color: white; cursor: pointer; }
        .screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .box { background: var(--card); padding: 30px; border-radius: 20px; width: 340px; text-align: center; }
    </style>
</head>
<body>

<div id="login-screen" class="screen">
    <div class="box">
        <h2 style="color: var(--gold)">🐺 WolfMessenger V5</h2>
        <input type="text" id="user-name" placeholder="Tên của bạn">
        <button onclick="toRoomScreen()" style="width: 100%">TIẾP TỤC</button>
    </div>
</div>

<div id="room-screen" class="screen hidden">
    <div class="box">
        <h3 id="hi-user"></h3>
        <button onclick="createRoom()" style="width: 100%; margin-bottom: 10px; background: #059669">TẠO PHÒNG MỚI</button>
        <input type="text" id="room-input" placeholder="Mã phòng">
        <button onclick="joinRoom()" style="width: 100%">THAM GIA</button>
    </div>
</div>

<div id="game-ui" class="app-container hidden">
    <div class="sidebar">
        <div style="padding: 15px; background: #0b1120; font-weight: bold;">ROOM: <span id="room-id-label"></span></div>
        <div id="player-list" style="flex: 1; overflow-y: auto;"></div>
        <div id="host-panel" class="hidden" style="padding: 15px; background: #1e1b4b; border-top: 2px solid var(--gold);">
            <div id="qr-box" style="background:white; padding:5px; border-radius:8px; margin-bottom:10px; text-align:center">
                <img id="qr-img" style="width: 110px">
            </div>
            <button onclick="startGame()" style="width: 100%; background: #059669; margin-bottom: 5px;">BẮT ĐẦU GAME</button>
            <button onclick="resolveAndNext()" style="width: 100%; background: var(--gold); color: black;">TIẾP THEO ⏩</button>
        </div>
    </div>
    <div class="main-chat">
        <div class="chat-header" style="padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between;">
            <div>
                <b id="role-text" style="color: var(--gold)">VAI TRÒ: ???</b><br>
                <small id="phase-label" style="text-transform: uppercase;">LOBBY</small>
            </div>
        </div>
        <div id="skill-hint" style="padding: 10px; background: #1e1b4b; color: var(--gold); text-align: center; font-weight: bold;" class="hidden"></div>
        <div class="messages" id="msg-list"></div>
        <div class="input-area">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn...">
            <button onclick="sendMsg()">Gửi</button>
        </div>
    </div>
</div>

<script>
// --- CONSTANTS ---
const ROLE = { WEREWOLF: 'WEREWOLF', SEER: 'SEER', GUARDIAN: 'GUARDIAN', VILLAGER: 'VILLAGER' };
const PHASE = { LOBBY: 'LOBBY', SEER: 'SEER_PHASE', GUARD: 'GUARD_PHASE', WOLF: 'WOLF_PHASE', VOTE: 'VOTE_PHASE', MORNING: 'MORNING' };

// --- FIREBASE ---
const firebaseConfig = { apiKey: "AIzaSyDErjt9kYyMdyiuFQAi3IhFl0tP4pbT_5A", databaseURL: "https://wolfmessenger-v1-default-rtdb.firebaseio.com", projectId: "wolfmessenger-v1" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- STATE ---
let myUser = { uid: "u_" + Math.random().toString(16).slice(2), name: "", room: "", role: ROLE.VILLAGER, isHost: false, isDead: false };
let players = {};
let currentPhase = PHASE.LOBBY;

// --- RECOVERY & QR AUTO-JOIN ---
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if(params.has("room")) document.getElementById("room-input").value = params.get("room");
    
    const saved = localStorage.getItem('wolf_v5_session');
    if (saved) {
        const data = JSON.parse(saved);
        if (confirm(`Quay lại phòng ${data.room}?`)) { myUser = data; enterRoom(data.room); }
    }
};

function toRoomScreen() {
    myUser.name = document.getElementById('user-name').value.trim();
    if (!myUser.name) return alert("Nhập tên!");
    document.getElementById('hi-user').innerText = `Chào ${myUser.name}!`;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('room-screen').classList.remove('hidden');
}

function createRoom() { myUser.isHost = true; enterRoom(Math.random().toString(36).substring(2, 8).toUpperCase()); }
function joinRoom() { const code = document.getElementById('room-input').value.toUpperCase(); if(code) enterRoom(code); }

function enterRoom(code) {
    myUser.room = code;
    localStorage.setItem('wolf_v5_session', JSON.stringify(myUser));
    const roomRef = db.ref(`rooms/${code}`);
    
    roomRef.child('players').once('value', s => {
        if(!s.exists()) myUser.isHost = true;
        roomRef.child(`players/${myUser.uid}`).update({ uid: myUser.uid, name: myUser.name, isOnline: true, isHost: myUser.isHost });
    });
    roomRef.child(`players/${myUser.uid}/isOnline`).onDisconnect().set(false);
    setupGameUI();
}

function setupGameUI() {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('room-id-label').innerText = myUser.room;
    
    const path = `rooms/${myUser.room}`;
    db.ref(`${path}/gameState/phase`).on('value', s => { currentPhase = s.val() || PHASE.LOBBY; syncUI(); });
    db.ref(`${path}/players`).on('value', s => { players = s.val() || {}; renderPlayers(); if(myUser.isHost) checkWin(); });
    db.ref(`${path}/players/${myUser.uid}/role`).on('value', s => { 
        myUser.role = s.val() || ROLE.VILLAGER; 
        document.getElementById('role-text').innerText = "VAI TRÒ: " + myUser.role;
    });
    db.ref(`${path}/players/${myUser.uid}/isDead`).on('value', s => myUser.isDead = !!s.val());
    db.ref(`${path}/messages`).limitToLast(30).on('child_added', s => renderMsg(s.val()));

    if(myUser.isHost) {
        document.getElementById('host-panel').classList.remove('hidden');
        const qrUrl = window.location.origin + window.location.pathname + "?room=" + myUser.room;
        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(qrUrl)}`;
    }
}

function syncUI() {
    document.getElementById('phase-label').innerText = currentPhase.replace("_", " ");
    const hint = document.getElementById('skill-hint');
    hint.classList.add('hidden');

    if(myUser.isDead) return;
    
    const isMyTurn = (currentPhase === PHASE.SEER && myUser.role === ROLE.SEER) || 
                     (currentPhase === PHASE.WOLF && myUser.role === ROLE.WEREWOLF) ||
                     (currentPhase === PHASE.GUARD && myUser.role === ROLE.GUARDIAN) ||
                     (currentPhase === PHASE.VOTE);

    if(isMyTurn) {
        hint.classList.remove('hidden');
        hint.innerText = "ĐẾN LƯỢT BẠN: CHỌN MỤC TIÊU TRONG DANH SÁCH!";
    }
}

function renderPlayers() {
    const list = document.getElementById('player-list'); list.innerHTML = "";
    Object.values(players).forEach(p => {
        const div = document.createElement('div');
        div.className = `player-card ${p.isDead ? 'dead' : ''}`;
        div.onclick = () => useSkill(p.uid);
        div.innerHTML = `<div style="width:10px;height:10px;border-radius:50%;background:${p.isOnline?'#22c55e':'#64748b'}"></div>
                         <b>${p.name}</b> ${p.uid === myUser.uid ? '(Bạn)' : ''}`;
        list.appendChild(div);
    });
}

function useSkill(targetUid) {
    if(myUser.isDead || currentPhase === PHASE.LOBBY) return;
    if(targetUid === myUser.uid && currentPhase !== PHASE.GUARD) return alert("Không thể tự chọn mình!");

    const path = `rooms/${myUser.room}/actions/${currentPhase}/${myUser.uid}`;
    
    if(currentPhase === PHASE.SEER && myUser.role === ROLE.SEER) {
        db.ref(`rooms/${myUser.room}/secretRoles/${targetUid}`).once('value', s => {
            const res = (s.val() === ROLE.WEREWOLF) ? "SÓI 🐺" : "DÂN 😇";
            systemMsg(`Kết quả soi ${players[targetUid].name}: ${res}`);
        });
    } else if([PHASE.WOLF, PHASE.GUARD, PHASE.VOTE].includes(currentPhase)) {
        db.ref(path).set(targetUid);
        systemMsg(`Đã chọn: ${players[targetUid].name}`);
    }
}

function resolveAndNext() {
    if(!myUser.isHost) return;
    const path = `rooms/${myUser.room}`;
    
    if(currentPhase === PHASE.WOLF) {
        db.ref(`${path}/actions`).once('value', s => {
            const acts = s.val() || {};
            const wolfVotes = acts[PHASE.WOLF] || {};
            const guardProt = Object.values(acts[PHASE.GUARD] || {})[0];
            
            let counts = {};
            Object.values(wolfVotes).forEach(v => counts[v] = (counts[v] || 0) + 1);
            let target = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, null);
            
            if(target && target !== guardProt) {
                db.ref(`${path}/players/${target}/isDead`).set(true);
                broadcastAI(`Đêm qua, ${players[target].name} đã bị Sói cắn chết.`);
            } else broadcastAI("Một đêm bình yên, không ai chết.");
            db.ref(`${path}/actions`).remove();
        });
    }

    if(currentPhase === PHASE.VOTE) {
        db.ref(`${path}/actions/${PHASE.VOTE}`).once('value', s => {
            const votes = s.val() || {};
            let counts = {};
            Object.values(votes).forEach(v => counts[v] = (counts[v] || 0) + 1);
            let target = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, null);
            if(target) {
                db.ref(`${path}/players/${target}/isDead`).set(true);
                broadcastAI(`Dân làng đã treo cổ ${players[target].name}.`);
            }
            db.ref(`${path}/actions/${PHASE.VOTE}`).remove();
        });
    }
    
    const flow = [PHASE.SEER, PHASE.GUARD, PHASE.WOLF, PHASE.MORNING, PHASE.VOTE];
    let next = flow[(flow.indexOf(currentPhase) + 1) % flow.length] || PHASE.SEER;
    db.ref(`${path}/gameState/phase`).set(next);
}

function startGame() {
    const ps = Object.values(players); if(ps.length < 4) return alert("Cần ít nhất 4 người!");
    let roles = [ROLE.WEREWOLF, ROLE.SEER, ROLE.GUARDIAN, ROLE.VILLAGER, ROLE.VILLAGER, ROLE.VILLAGER];
    roles = roles.slice(0, ps.length).sort(() => Math.random() - 0.5);
    
    ps.forEach((p, i) => {
        db.ref(`rooms/${myUser.room}/players/${p.uid}/role`).set(roles[i]);
        db.ref(`rooms/${myUser.room}/secretRoles/${p.uid}`).set(roles[i]);
    });
    db.ref(`rooms/${myUser.room}/gameState/phase`).set(PHASE.SEER);
    broadcastAI("TRÒ CHƠI BẮT ĐẦU! Tiên tri hãy hành động.");
}

function sendMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim(); if(!text) return;
    if(text === "/xoafirebase") { db.ref(`rooms/${myUser.room}`).remove(); return; }
    
    const isNight = [PHASE.SEER, PHASE.GUARD, PHASE.WOLF].includes(currentPhase);
    if(myUser.isDead) return alert("Bạn đã chết!");
    if(isNight && myUser.role !== ROLE.WEREWOLF && !myUser.isHost) return alert("Đêm hãy im lặng!");

    db.ref(`rooms/${myUser.room}/messages`).push({ sender: myUser.name, text: text, uid: myUser.uid, role: myUser.role, phase: currentPhase });
    input.value = "";
}

function renderMsg(m) {
    const isNight = [PHASE.SEER, PHASE.GUARD, PHASE.WOLF].includes(m.phase);
    if(isNight && m.role === ROLE.WEREWOLF && myUser.role !== ROLE.WEREWOLF && !myUser.isHost) return;
    
    const list = document.getElementById('msg-list');
    const div = document.createElement('div');
    div.className = `msg ${m.uid === 'ai' ? 'system' : (m.uid === myUser.uid ? 'sent' : 'received')}`;
    div.textContent = `${m.sender}: ${m.text}`;
    list.appendChild(div); list.scrollTop = list.scrollHeight;
}

function checkWin() {
    const alive = Object.values(players).filter(p => !p.isDead);
    const wolves = alive.filter(p => p.role === ROLE.WEREWOLF).length;
    const humans = alive.length - wolves;
    if(wolves === 0 && currentPhase !== PHASE.LOBBY) broadcastAI("DÂN LÀNG THẮNG!");
    if(wolves >= humans && currentPhase !== PHASE.LOBBY) broadcastAI("PHE SÓI THẮNG!");
}

function broadcastAI(t) { db.ref(`rooms/${myUser.room}/messages`).push({ sender: "🤖 AI", text: t, uid: "ai" }); }
function systemMsg(t) { renderMsg({ sender: "HỆ THỐNG", text: t, uid: "sys" }); }
</script>
</body>
</html>
