<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WolfMessenger V1 - Pro Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #2563eb; --wolf: #ef4444; --gold: #facc15; }
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; overflow: hidden; }
        .hidden { display: none !important; }
        .app-container { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
        .sidebar { background: #111827; border-right: 1px solid #334155; overflow-y: auto; display: flex; flex-direction: column; }
        .chat-item { padding: 12px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .chat-item:hover { background: #1e293b; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #475569; flex-shrink: 0; }
        .main-chat { display: flex; flex-direction: column; background: var(--bg); }
        .chat-header { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 15px; font-size: 14px; }
        .msg.sent { background: var(--primary); align-self: flex-end; }
        .msg.received { background: #334155; align-self: flex-start; }
        .msg.wolf { border: 1px solid var(--wolf); color: #fca5a5; }
        .lobby-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background: var(--card); padding: 40px; border-radius: 25px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-vote { background: var(--gold); color: black; font-size: 11px; padding: 4px 8px; margin-left: auto; }
        .vote-count { background: var(--wolf); color: white; padding: 2px 6px; border-radius: 10px; font-size: 10px; margin-left: 5px; }
    </style>
</head>
<body>

<div id="lobby" class="lobby-screen">
    <div class="login-box">
        <h1 style="color: var(--gold)">🐺 WolfMessenger</h1>
        <input type="text" id="userName" placeholder="Tên của bạn">
        <input type="text" id="roomCode" placeholder="Mã phòng">
        <button onclick="joinGame()" style="background: var(--primary); color: white; width: 100%;">VÀO PHÒNG</button>
    </div>
</div>

<div id="game-ui" class="app-container hidden">
    <div class="sidebar">
        <div style="padding: 15px; font-weight: bold; background: #1e293b;">Đoạn chat</div>
        <div class="chat-item" onclick="changeChat('village', null)">
            <div class="avatar" style="background: var(--primary);"></div>
            <div><b>Làng Ma Sói</b></div>
        </div>
        <div id="side-wolf" class="chat-item hidden" onclick="changeChat('wolf', null)">
            <div class="avatar" style="background: var(--wolf);"></div>
            <div><b>Hội Đồng Sói</b></div>
        </div>
        <div id="side-skill" class="chat-item hidden" onclick="changeChat('skill', null)">
            <div class="avatar" style="background: var(--gold);"></div>
            <div><b>Kênh Chức Năng</b></div>
        </div>
        <div class="chat-item" onclick="changeChat('admin', null)">
            <div class="avatar" style="background: #64748b;"></div>
            <div><b>Inbox Quản Trò</b></div>
        </div>
        
        <div style="padding: 10px; font-size: 12px; color: #94a3b8; background: #0f172a;">NGƯỜI CHƠI (Chat riêng/Vote)</div>
        <div id="player-list-area"></div>

        <div id="admin-panel" class="hidden" style="padding: 15px; background: #1e1b4b; border-top: 1px solid var(--gold);">
            <button onclick="startGame()" style="background: #059669; color: white; width: 100%; margin-bottom: 5px;">CHIA 50 VAI & BẮT ĐẦU</button>
            <button onclick="toggleTime()" style="background: var(--primary); color: white; width: 100%;">CHUYỂN NGÀY/ĐÊM</button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div>
                <b id="chat-title">Làng Ma Sói</b><br>
                <small id="user-info">Đang kết nối...</small>
            </div>
            <div id="phase-badge" style="background: var(--gold); color: black; padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 13px;">☀️ BAN NGÀY</div>
        </div>
        <div class="messages" id="msg-list"></div>
        <div style="padding: 15px; background: #1e293b; display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." style="margin: 0; flex-grow: 1;">
            <button onclick="sendMsg()" style="width: 70px; background: var(--primary); color: white;">Gửi</button>
        </div>
    </div>
</div>

<script>
    const rolesPool = [
        "Dân Làng", "Tiên Tri", "Tiên Tri Tập Sự", "Aura Seer", "Bảo Vệ", "Phù Thủy", "Thợ Săn", "Cupid", "Con Bệnh", "Hồn Ma", 
        "Thằng Ngốc", "Người Lai Sói", "Mason", "Thị Trưởng", "Hoàng Tử", "Kẻ Phá Rối", "Người Cứng Cỏi", "Thám Tử P.I.", "Beholder", "Già Làng",
        "Ma Sói", "Sói Con", "Sói Cô Đơn", "Sói Alpha", "Sói Huyền Bí", "Big Bad Wolf", "Kẻ Phản Bội", "Pháp Sư Sói", "Kẻ Say Rượu", "Người Nhân Bản",
        "Đứa Con Hoang Dã", "Chán Đời", "Du Côn", "Ma Cà Rồng", "Trưởng Giáo Phái", "Bùa Hộ Mệnh", "Spellcaster", "Time Bandit", "Revealer", "Empath",
        "Squire", "Martyr", "Nostradamus", "Virginia Wolf", "Bloody Mary", "Frankenstein", "Ông Kẹ", "Yêu Tinh", "The Thing", "Insomniac"
    ];

    const firebaseConfig = {
        apiKey: "AIzaSyDErjt9kYyMdyiuFQAi3IhFl0tP4pbT_5A",
        authDomain: "wolfmessenger-v1.firebaseapp.com",
        projectId: "wolfmessenger-v1",
        storageBucket: "wolfmessenger-v1.firebasestorage.app",
        messagingSenderId: "553096273155",
        appId: "1:553096273155:web:e0fbc409f5587486471d36",
        databaseURL: "https://wolfmessenger-v1-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myUser = { id: 0, name: "", role: "Dân Làng", room: "" };
    let currentMode = "village"; 
    let targetUser = null; 
    let isNight = false;

    function joinGame() {
        const name = document.getElementById('userName').value.trim();
        const code = document.getElementById('roomCode').value.trim().toUpperCase();
        if(!name || !code) return alert("Nhập đủ tên và phòng!");

        myUser.name = name; myUser.room = code;
        const roomRef = db.ref(`rooms/${code}/players`);
        roomRef.once('value', (snapshot) => {
            myUser.id = snapshot.numChildren() + 1;
            if(myUser.id === 1) myUser.isAdmin = true;
            roomRef.child(myUser.id).set(myUser);
            setupGameUI();
        });
    }

    function setupGameUI() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        if(myUser.isAdmin) document.getElementById('admin-panel').classList.remove('hidden');
        
        // Lắng nghe lệnh xóa phòng từ hệ thống
        db.ref(`rooms/${myUser.room}`).on('value', (snapshot) => {
            if (!snapshot.exists() && myUser.room !== "") {
                alert("Dữ liệu phòng đã bị xóa bởi lệnh /xoafirebase!");
                location.reload();
            }
        });

        db.ref(`rooms/${myUser.room}/players/${myUser.id}/role`).on('value', (s) => {
            myUser.role = s.val() || "Dân Làng";
            document.getElementById('user-info').innerText = `ID: ${myUser.id} | ${myUser.name} | Vai: ${myUser.role}`;
            if(myUser.role.includes("Sói")) document.getElementById('side-wolf').classList.remove('hidden');
            if(myUser.role !== "Dân Làng" && !myUser.role.includes("Sói")) document.getElementById('side-skill').classList.remove('hidden');
        });

        db.ref(`rooms/${myUser.room}/isNight`).on('value', (s) => {
            isNight = s.val() || false;
            document.getElementById('phase-badge').innerText = isNight ? "🌙 BAN ĐÊM" : "☀️ BAN NGÀY";
            document.getElementById('phase-badge').style.background = isNight ? "#4a148c" : "#facc15";
        });

        db.ref(`rooms/${myUser.room}/messages`).on('child_added', (s) => renderMessage(s.val()));
        db.ref(`rooms/${myUser.room}/players`).on('value', (s) => updatePlayerList(s.val()));
        db.ref(`rooms/${myUser.room}/votes`).on('value', (s) => updateVoteUI(s.val()));
    }

    function updatePlayerList(playersData) {
        const area = document.getElementById('player-list-area');
        area.innerHTML = "";
        if(!playersData) return;
        Object.values(playersData).forEach(p => {
            if(p.id === myUser.id) return;
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="avatar"></div><div style="flex-grow:1" onclick="changeChat('private', ${JSON.stringify(p).replace(/"/g, '&quot;')})"><b>${p.name}</b><br><small>ID: ${p.id}</small></div>
                             <button class="btn-vote" onclick="castVote(${p.id})">VOTE</button><span class="vote-count" id="vc-${p.id}">0</span>`;
            area.appendChild(div);
        });
    }

    function castVote(targetId) {
        if(isNight) return alert("Ban đêm không thể biểu quyết!");
        db.ref(`rooms/${myUser.room}/votes/${myUser.id}`).set(targetId);
    }

    function updateVoteUI(votes) {
        const counts = {};
        if(votes) Object.values(votes).forEach(vid => counts[vid] = (counts[vid] || 0) + 1);
        document.querySelectorAll('.vote-count').forEach(el => el.innerText = counts[el.id.split('-')[1]] || 0);
    }

    function startGame() {
        db.ref(`rooms/${myUser.room}/players`).once('value', (s) => {
            const keys = Object.keys(s.val());
            let shuffledRoles = [...rolesPool].sort(() => Math.random() - 0.5);
            keys.forEach((key, i) => db.ref(`rooms/${myUser.room}/players/${key}/role`).set(shuffledRoles[i]));
            db.ref(`rooms/${myUser.room}/votes`).remove();
            alert("Đã chia xong vai cho " + keys.length + " người!");
        });
    }

    function toggleTime() { db.ref(`rooms/${myUser.room}/isNight`).set(!isNight); }

    function changeChat(mode, user) {
        currentMode = mode; targetUser = user;
        const titles = { village: "Làng Ma Sói", wolf: "Hội Đồng Sói", skill: "Kênh Chức Năng", admin: "Inbox Quản Trò" };
        document.getElementById('chat-title').innerText = user ? "Chat riêng: " + user.name : titles[mode];
        document.getElementById('msg-list').innerHTML = "";
        db.ref(`rooms/${myUser.room}/messages`).once('value', (s) => { if(s.val()) Object.values(s.val()).forEach(m => renderMessage(m)); });
    }

    function sendMsg() {
        const text = document.getElementById('chat-input').value.trim();
        if(!text) return;

        // --- CÂU LỆNH GIẢI TÁN PHÒNG ---
        if (currentMode === 'admin' && text.toLowerCase() === '/xoafirebase') {
            if (confirm("Hành động này sẽ xóa sạch dữ liệu phòng trên Firebase. Tiếp tục?")) {
                db.ref(`rooms/${myUser.room}`).remove()
                    .then(() => { alert("Đã xóa Firebase thành công!"); location.reload(); });
                return;
            }
        }

        if(currentMode === 'wolf' && !myUser.role.includes("Sói") && !myUser.isAdmin) return alert("Bạn không phải Sói!");
        if(currentMode === 'village' && isNight && !myUser.isAdmin) return alert("Đêm phải im lặng!");

        db.ref(`rooms/${myUser.room}/messages`).push({
            sender: myUser.name, senderId: myUser.id, text: text, mode: currentMode,
            receiverId: targetUser ? targetUser.id : null
        });
        document.getElementById('chat-input').value = "";
    }

    function renderMessage(m) {
        if(m.mode === 'wolf' && !myUser.role.includes("Sói") && !myUser.isAdmin) return;
        if(m.mode === 'private') {
            const isRel = (m.senderId === myUser.id && m.receiverId === targetUser?.id) || (m.senderId === targetUser?.id && m.receiverId === myUser.id);
            if(!isRel && !myUser.isAdmin) return;
        }
        if(m.mode !== currentMode) return;

        const list = document.getElementById('msg-list');
        const div = document.createElement('div');
        div.className = `msg ${m.senderId === myUser.id ? 'sent' : 'received'} ${m.mode === 'wolf' ? 'wolf' : ''}`;
        div.innerHTML = `<b>${m.sender}:</b> ${m.text}`;
        list.appendChild(div);
        list.scrollTop = list.scrollHeight;
    }
</script>
</body>
</html>
